name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Typecheck, unit tests and build for every workspace package.
      - run: npm run check

  package:
    name: package VSIX and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tag must match the version shared by the root and every workspace package.
      - name: Verify tag matches package versions
        run: |
          node -e '
            const fs = require("fs");
            const files = ["package.json", ...fs.readdirSync("packages").map(d => `packages/${d}/package.json`)];
            const versions = new Set(files.map(f => JSON.parse(fs.readFileSync(f, "utf8")).version));
            if (versions.size !== 1) { console.error("package versions differ:", [...versions]); process.exit(1); }
            const [version] = versions;
            if (`v${version}` !== process.env.GITHUB_REF_NAME) {
              console.error(`tag ${process.env.GITHUB_REF_NAME} does not match package version v${version}`); process.exit(1);
            }
            console.log(`releasing v${version}`);
          '
      - run: npm run package --workspace unify-provider
      - uses: actions/upload-artifact@v4
        with:
          name: unify-provider-vsix
          path: packages/extension/*.vsix
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/extension/*.vsix
          generate_release_notes: true
